services:
  - type: web
    name: crawlguard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crawlguard-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: FROM_EMAIL
        sync: false

databases:
  - name: crawlguard-db
    plan: free
    databaseName: crawlguard
    user: crawlguard
